# Lädt die Dateien aus upload/ ins Release "latest" hoch (öffentliches Repo: kostenlose Actions-Minuten).
name: Update veröffentlichen
on:
  push:
    branches: [main]
    paths: ["upload/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prüfsumme kontrollieren
        run: |
          want=$(jq -r .sha256 upload/latest.json)
          have=$(sha256sum upload/Belegwerk-Setup.exe | cut -d' ' -f1)
          echo "latest.json: $want"; echo "Installer:   $have"
          test "$want" = "$have"
      - name: Ins Release "latest" hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version upload/latest.json)
          notes=$(jq -r '.notes // ""' upload/latest.json)
          # Release neu anlegen, damit Datum und Titel die aktuelle Version zeigen.
          # Die Download-Adressen bleiben gleich (Tag "latest").
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest upload/Belegwerk-Setup.exe upload/latest.json \
            --title "Belegwerk $v" --notes "Version $v. $notes" --target main
          gh release view latest --json tagName,name,publishedAt,assets --jq '"\(.name) \(.publishedAt)", (.assets[] | "\(.name) \(.size)")'
